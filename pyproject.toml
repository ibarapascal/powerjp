[project]
name = "powerjp"
version = "0.0.1"
description = "Open data pipeline and visualization for Japan's power grid"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "boto3>=1.35",
    "pandas>=2.2",
    "pyarrow>=18",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "pyshp>=2.3",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "orchestration"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
